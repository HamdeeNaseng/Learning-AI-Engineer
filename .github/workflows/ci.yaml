# Priority: P1
# Purpose:
# Fast, deterministic quality gate for the AI Lab repository.
#
# Important:
# This workflow DOES NOT execute every research notebook.
# Some labs may require CUDA, large models, large datasets, or significant VRAM.

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ===========================================================================
  # P0 - Python quality gate
  # ===========================================================================

  quality:
    name: Python Quality
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # -----------------------------------------------------------------------
      # P0 - Checkout
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      # -----------------------------------------------------------------------
      # P0 - Python
      # Uses .python-version from repository root.
      # -----------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version


      # -----------------------------------------------------------------------
      # P0 - uv
      # -----------------------------------------------------------------------

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true


      # -----------------------------------------------------------------------
      # P0 - Dependency integrity
      # -----------------------------------------------------------------------

      - name: Synchronize environment
        run: uv sync --locked


      # -----------------------------------------------------------------------
      # P1 - Lint
      # -----------------------------------------------------------------------

      - name: Ruff lint
        run: uv run ruff check .


      # -----------------------------------------------------------------------
      # P1 - Formatting
      # -----------------------------------------------------------------------

      - name: Ruff format check
        run: uv run ruff format --check .


      # -----------------------------------------------------------------------
      # P0 - Tests
      # -----------------------------------------------------------------------

      - name: Run tests
        run: uv run pytest


  # ===========================================================================
  # P1 - Notebook structural validation
  #
  # Does not execute notebooks.
  #
  # Purpose:
  # - detect corrupted .ipynb JSON
  # - verify notebook schema basics
  # - avoid accidentally committing empty/broken notebooks
  # ===========================================================================

  notebooks:
    name: Notebook Validation
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version


      - name: Validate notebook structure
        run: python scripts/validate_notebooks.py labs


  # ===========================================================================
  # P1 - Dependency lock verification
  # ===========================================================================

  lock:
    name: Dependency Lock
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true


      - name: Verify uv.lock
        run: uv lock --check


  # ===========================================================================
  # P1 - Docker Compose validation
  #
  # Validate configuration only.
  # Avoid expensive PyTorch/container builds on every PR.
  # ===========================================================================

  docker:
    name: Docker Configuration
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Validate Docker Compose
        run: docker compose config --quiet


  # ===========================================================================
  # P0 - Aggregate gate
  #
  # Useful later as the single required GitHub Branch Protection check.
  # ===========================================================================

  ci:
    name: CI Passed
    if: always()

    needs:
      - quality
      - notebooks
      - lock
      - docker

    runs-on: ubuntu-latest

    steps:

      - name: Verify required jobs
        shell: bash
        run: |
          # P0 - Required CI gate.

          if [[ "${{ needs.quality.result }}" != "success" ]]; then
            echo "Python quality failed."
            exit 1
          fi

          if [[ "${{ needs.notebooks.result }}" != "success" ]]; then
            echo "Notebook validation failed."
            exit 1
          fi

          if [[ "${{ needs.lock.result }}" != "success" ]]; then
            echo "Dependency lock validation failed."
            exit 1
          fi

          if [[ "${{ needs.docker.result }}" != "success" ]]; then
            echo "Docker configuration validation failed."
            exit 1
          fi

          echo "All required CI checks passed."