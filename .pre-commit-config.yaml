# Priority: P1
# Purpose: Local quality gate before Git commit.

repos:

  # Keep this rev in sync with the ruff version resolved in uv.lock,
  # otherwise pre-commit and CI can disagree on lint/format results.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6

    hooks:

      - id: ruff-check
        args:
          - --fix

      - id: ruff-format